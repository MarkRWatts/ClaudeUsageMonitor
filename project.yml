name: ClaudeUsageMonitor
options:
  bundleIdPrefix: com.markwatts
  deploymentTarget:
    macOS: "13.0"

settings:
  base:
    SWIFT_VERSION: 5.0
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

targets:
  ClaudeUsageMonitor:
    type: application
    platform: macOS
    sources:
      - path: Sources/ClaudeUsageMonitor
    info:
      path: Sources/ClaudeUsageMonitor/Info.plist
      properties:
        LSUIElement: true
        CFBundleName: ClaudeUsageMonitor
        CFBundleDisplayName: Claude Usage Monitor
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSHumanReadableCopyright: ""
    entitlements:
      path: Sources/ClaudeUsageMonitor/ClaudeUsageMonitor.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.markwatts.ClaudeUsageMonitor
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: true
